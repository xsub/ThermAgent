name: ci

on:
  push:
  pull_request:

jobs:
  python-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile lab/python/thermagentctl
      - run: lab/python/thermagentctl validate edge/policies/jetson-nano-lite.policy
      - run: lab/python/thermagentctl simulate edge/policies/jetson-nano-lite.policy --trace lab/traces/sample-jetson-camera.jsonl

  rust-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo check
        working-directory: edge/rust/thermagentd

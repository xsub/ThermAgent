name: ci

on:
  push:
  pull_request:

jobs:
  python-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make check-python
      - run: make validate
      - run: make simulate
      - run: make report
      - run: make check-packaging
      - run: make check-server
      - run: make check-operator

  rust-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --check
        working-directory: edge/rust/thermagentd
      - run: cargo check
        working-directory: edge/rust/thermagentd
      - run: cargo test
        working-directory: edge/rust/thermagentd
